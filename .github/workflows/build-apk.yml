name: Build Android APK

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  secrets:
    uses: zka32101/shared_core/.github/workflows/secure-secrets-inject.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      app_name: kokugo-kore
      gcp_project_id: shougakukore
      gcp_service_account: kokugo-kore-ci-bot@shougakukore.iam.gserviceaccount.com
      gcp_wif_provider: projects/533411745674/locations/global/workloadIdentityPools/kokugo-kore-github-pool/providers/kokugo-kore-github-provider
      secret_keys: "revenuecat-api-key,admob-app-id,admob-banner-ad-unit-id,admob-interstitial-ad-unit-id,android-keystore-base64,android-keystore-password,android-key-password"

  build-apk:
    name: Build APK (${{ inputs.build_type }})
    needs: secrets
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Clean and get dependencies
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf .dart_tool/
          flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Parse secrets from Secret Manager
        env:
          SECRETS_JSON: ${{ needs.secrets.outputs.secrets_json }}
        run: |
          $secrets = $env:SECRETS_JSON | ConvertFrom-Json
          foreach ($prop in $secrets.PSObject.Properties) {
            Write-Host "::add-mask::$($prop.Value)"
          }
          "REVENUECAT_API_KEY=$($secrets.REVENUECAT_API_KEY)" >> $env:GITHUB_ENV
          "ADMOB_APP_ID_ANDROID=$($secrets.ADMOB_APP_ID)" >> $env:GITHUB_ENV
          "ADMOB_BANNER_ID=$($secrets.ADMOB_BANNER_AD_UNIT_ID)" >> $env:GITHUB_ENV
          "ADMOB_INTERSTITIAL_ID=$($secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID)" >> $env:GITHUB_ENV
          "ANDROID_KEYSTORE_BASE64=$($secrets.ANDROID_KEYSTORE_BASE64)" >> $env:GITHUB_ENV
          "KEYSTORE_PASSWORD=$($secrets.ANDROID_KEYSTORE_PASSWORD)" >> $env:GITHUB_ENV
          "KEY_PASSWORD=$($secrets.ANDROID_KEY_PASSWORD)" >> $env:GITHUB_ENV
        shell: powershell

      - name: Create keystore directory
        run: |
          if (!(Test-Path "android\keystore")) {
            New-Item -ItemType Directory -Path "android\keystore" -Force
          }
        shell: powershell

      - name: Decode and write keystore
        run: |
          if ("$env:ANDROID_KEYSTORE_BASE64" -ne "") {
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
            [System.IO.File]::WriteAllBytes("android\keystore\release_new.jks", $bytes)
            Write-Host "✓ Keystore decoded"
          } else {
            Write-Host "⚠️ ANDROID_KEYSTORE_BASE64 not set - debug build only"
          }
        shell: powershell

      - name: Map K: drive (Japanese path workaround)
        run: |
          $projectPath = "${{ github.workspace }}"
          subst K: $projectPath
          Write-Host "✓ K: drive mapped to $projectPath"
        shell: powershell

      - name: Build APK (Release)
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') ||
          (github.event_name == 'push')
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd K:/
          flutter build apk --release --no-pub `
            --dart-define=REVENUE_CAT_API_KEY=$env:REVENUECAT_API_KEY `
            --dart-define=ADMOB_BANNER_ID=$env:ADMOB_BANNER_ID `
            --dart-define=ADMOB_INTERSTITIAL_ID=$env:ADMOB_INTERSTITIAL_ID
          Write-Host "✓ Release APK build completed"
        shell: powershell

      - name: Build APK (Debug)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug'
        run: |
          cd K:/
          flutter build apk --debug
          Write-Host "✓ Debug APK build completed"
        shell: powershell

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}
          path: |
            build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Display build info
        run: |
          $apkPath = Get-ChildItem -Path "build\app\outputs\flutter-apk\*.apk" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($apkPath) {
            $size = $apkPath.Length / 1MB
            Write-Host "✓ APK built successfully"
            Write-Host "  Path: $($apkPath.FullName)"
            Write-Host "  Size: $([Math]::Round($size, 2)) MB"
          } else {
            Write-Host "⚠️ APK not found"
          }
        shell: powershell

      - name: Unmount K: drive
        if: always()
        run: |
          subst K: /d
          Write-Host "✓ K: drive unmounted"
        shell: powershell
