name: Deploy - Build & Upload

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deploy type'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - release
          - debug

jobs:
  secrets:
    if: inputs.deploy_type != 'debug'
    uses: zka32101/shared_core/.github/workflows/secure-secrets-inject.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      app_name: kokugo-kore
      gcp_project_id: shougakukore
      gcp_service_account: kokugo-kore-ci-bot@shougakukore.iam.gserviceaccount.com
      gcp_wif_provider: projects/533411745674/locations/global/workloadIdentityPools/kokugo-kore-github-pool/providers/kokugo-kore-github-provider
      secret_keys: "revenuecat-api-key,admob-app-id,admob-banner-ad-unit-id,admob-interstitial-ad-unit-id,android-keystore-base64,android-keystore-password,android-key-password,play-console-sa-key"

  deploy:
    name: Deploy (${{ inputs.deploy_type }})
    needs: [secrets]
    if: always() && (needs.secrets.result == 'success' || needs.secrets.result == 'skipped')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Version management
      - name: Update version (Release/Internal)
        if: inputs.deploy_type != 'debug'
        run: |
          $pubspecPath = 'pubspec.yaml'
          $content = Get-Content $pubspecPath -Raw
          $versionMatch = [regex]::Match($content, 'version: (\d+\.\d+\.\d+)\+(\d+)')
          if ($versionMatch.Success) {
            $version = $versionMatch.Groups[1].Value
            $buildCode = [int]$versionMatch.Groups[2].Value + 1
            $newVersion = "$version+$buildCode"
            $content = $content -replace "version: $($versionMatch.Value)", "version: $newVersion"
            Set-Content $pubspecPath $content
            Write-Host "✓ Version updated to: $newVersion"
          }
        shell: powershell

      - name: Parse secrets from Secret Manager
        if: inputs.deploy_type != 'debug'
        env:
          SECRETS_JSON: ${{ needs.secrets.outputs.secrets_json }}
        run: |
          $secrets = $env:SECRETS_JSON | ConvertFrom-Json
          foreach ($prop in $secrets.PSObject.Properties) {
            Write-Host "::add-mask::$($prop.Value)"
          }
          "REVENUECAT_API_KEY=$($secrets.REVENUECAT_API_KEY)" >> $env:GITHUB_ENV
          "ADMOB_APP_ID_ANDROID=$($secrets.ADMOB_APP_ID)" >> $env:GITHUB_ENV
          "ADMOB_BANNER_ID=$($secrets.ADMOB_BANNER_AD_UNIT_ID)" >> $env:GITHUB_ENV
          "ADMOB_INTERSTITIAL_ID=$($secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID)" >> $env:GITHUB_ENV
          "ANDROID_KEYSTORE_BASE64=$($secrets.ANDROID_KEYSTORE_BASE64)" >> $env:GITHUB_ENV
          "KEYSTORE_PASSWORD=$($secrets.ANDROID_KEYSTORE_PASSWORD)" >> $env:GITHUB_ENV
          "KEY_PASSWORD=$($secrets.ANDROID_KEY_PASSWORD)" >> $env:GITHUB_ENV
          Set-Content -Path "$env:RUNNER_TEMP\play-console-sa-key.json" -Value $secrets.PLAY_CONSOLE_SA_KEY
        shell: powershell

      - name: Create keystore directory
        run: |
          if (!(Test-Path "android\keystore")) {
            New-Item -ItemType Directory -Path "android\keystore" -Force
          }
        shell: powershell

      - name: Decode and write keystore
        run: |
          if ("$env:ANDROID_KEYSTORE_BASE64" -ne "") {
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
            [System.IO.File]::WriteAllBytes("android\keystore\release_new.jks", $bytes)
            Write-Host "✓ Keystore decoded"
          } else {
            Write-Host "⚠️ ANDROID_KEYSTORE_BASE64 not set"
          }
        shell: powershell

      - name: Map K: drive (Japanese path workaround)
        run: |
          $projectPath = "${{ github.workspace }}"
          subst K: $projectPath
          Write-Host "✓ K: drive mapped"
        shell: powershell

      # Build APK (Release)
      - name: Build APK (Release)
        if: inputs.deploy_type == 'release' || inputs.deploy_type == 'internal'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd K:/
          flutter build apk --release --no-pub `
            --dart-define=REVENUE_CAT_API_KEY=$env:REVENUECAT_API_KEY `
            --dart-define=ADMOB_BANNER_ID=$env:ADMOB_BANNER_ID `
            --dart-define=ADMOB_INTERSTITIAL_ID=$env:ADMOB_INTERSTITIAL_ID
          Write-Host "✓ Release APK built"
        shell: powershell

      # Build AAB (for Google Play)
      - name: Build AAB (Release)
        if: inputs.deploy_type == 'release' || inputs.deploy_type == 'internal'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd K:/
          flutter build appbundle --release --no-pub `
            --dart-define=REVENUE_CAT_API_KEY=$env:REVENUECAT_API_KEY `
            --dart-define=ADMOB_BANNER_ID=$env:ADMOB_BANNER_ID `
            --dart-define=ADMOB_INTERSTITIAL_ID=$env:ADMOB_INTERSTITIAL_ID
          Write-Host "✓ Release AAB built"
        shell: powershell

      # Build APK (Debug)
      - name: Build APK (Debug)
        if: inputs.deploy_type == 'debug'
        run: |
          cd K:/
          flutter build apk --debug
          Write-Host "✓ Debug APK built"
        shell: powershell

      - name: Unmount K: drive
        if: always()
        run: |
          subst K: /d
          Write-Host "✓ K: drive unmounted"
        shell: powershell

      - name: Upload to Google Play Internal Track
        if: inputs.deploy_type == 'internal'
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ runner.temp }}\play-console-sa-key.json
          packageName: com.yourwish.shougakukore.kokugo
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

      - name: Clean up Play Console key file
        if: always() && inputs.deploy_type == 'internal'
        run: Remove-Item -Path "$env:RUNNER_TEMP\play-console-sa-key.json" -ErrorAction SilentlyContinue
        shell: powershell

      # Upload artifacts
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.deploy_type }}
          path: |
            build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Upload AAB artifact
        if: inputs.deploy_type == 'release' || inputs.deploy_type == 'internal'
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.deploy_type }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Commit version update
      - name: Commit version update
        if: inputs.deploy_type != 'debug'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add pubspec.yaml
          git commit -m "chore: update build version [skip ci]" || echo "No changes to commit"
        shell: bash

      - name: Push version update
        if: inputs.deploy_type != 'debug'
        run: git push origin HEAD:main
        shell: bash
